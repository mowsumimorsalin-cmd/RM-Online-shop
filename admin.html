<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RM Online Shop - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#222;
}

.topbar{
  background:#111;
  color:#fff;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.topbar h1{
  margin:0;
  font-size:21px;
}

.topbar small{
  color:#bbb;
}

.container{
  max-width:1250px;
  margin:22px auto;
  padding:0 15px;
}

.login-box,
.dashboard{
  background:#fff;
  border-radius:15px;
  padding:22px;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.login-box{
  max-width:430px;
  margin:70px auto;
}

h2{
  margin-top:0;
}

input,
select,
textarea,
button{
  font:inherit;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:600;
}

.login-btn{
  width:100%;
  margin-top:16px;
  background:#111;
  color:#fff;
}

.logout-btn{
  background:#fff;
  color:#111;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  display:none;
}

.error{
  background:#ffe8e8;
  color:#a00000;
}


/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:9px;
  margin:20px 0;
}

.stat{
  background:#f7f7f7;
  border:1px solid #e3e3e3;
  border-radius:10px;
  padding:12px 6px;
  text-align:center;
  cursor:pointer;
  transition:.15s;
}

.stat:hover{
  transform:translateY(-2px);
}

.stat.active{
  background:#111;
  color:#fff;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}


/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:grid;
  grid-template-columns:1fr 180px 120px;
  gap:10px;
  margin-bottom:14px;
}

.search-box{
  position:relative;
}

.search-box input{
  padding-left:38px;
}

.search-icon{
  position:absolute;
  left:12px;
  top:11px;
}

.result-info{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}


/* =========================
   COMPACT ORDER LIST
========================= */

.order-list{
  width:100%;
  overflow-x:auto;
}

.order-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 7px;
  min-width:800px;
}

.order-table thead th{
  text-align:left;
  font-size:13px;
  color:#666;
  padding:8px 10px;
  font-weight:600;
}

.order-row{
  background:#fff;
}

.order-row td{
  padding:12px 10px;
  border-top:1px solid #e5e5e5;
  border-bottom:1px solid #e5e5e5;
  white-space:nowrap;
}

.order-row td:first-child{
  border-left:1px solid #e5e5e5;
  border-radius:9px 0 0 9px;
}

.order-row td:last-child{
  border-right:1px solid #e5e5e5;
  border-radius:0 9px 9px 0;
}

.order-number{
  font-weight:bold;
  color:#111;
  font-size:13px;
}

.order-date{
  color:#777;
  font-size:11px;
  margin-top:3px;
}

.customer-name{
  font-weight:600;
}

.phone{
  color:#0759c7;
  font-size:13px;
}

.total{
  font-weight:bold;
}

.status-select{
  min-width:120px;
  padding:7px;
  font-size:13px;
}

.view-btn{
  background:#111;
  color:#fff;
  padding:8px 12px;
  font-size:13px;
}

.note-btn{
  background:#f2f2f2;
  color:#111;
  padding:8px 11px;
  font-size:13px;
}

.note-exists{
  background:#fff2b8;
}

.empty{
  text-align:center;
  padding:45px;
  color:#777;
  background:#fafafa;
  border-radius:10px;
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:780px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:15px;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.modal-header{
  padding:17px 20px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  position:sticky;
  top:0;
  background:#fff;
  z-index:2;
}

.modal-header h3{
  margin:0;
  font-size:18px;
}

.close-btn{
  background:#eee;
  font-size:18px;
  width:38px;
  height:38px;
  padding:0;
}

.modal-body{
  padding:20px;
}

.detail-section{
  border:1px solid #e5e5e5;
  border-radius:10px;
  padding:14px;
  margin-bottom:13px;
}

.detail-title{
  font-weight:bold;
  margin-bottom:10px;
  font-size:14px;
}

.customer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 20px;
  line-height:1.6;
}

.address{
  margin-top:10px;
  line-height:1.6;
}

.call-btn{
  display:inline-block;
  background:#111;
  color:#fff;
  padding:5px 9px;
  border-radius:6px;
  text-decoration:none;
  font-size:12px;
  margin-left:6px;
}

.order-id-row{
  display:flex;
  gap:7px;
}

.order-id-row input{
  background:#f8f8f8;
  font-size:12px;
}

.copy-btn{
  background:#eee;
  white-space:nowrap;
}

.product-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.product-row:last-child{
  border-bottom:0;
}

.product-name{
  font-weight:600;
}

.product-meta{
  color:#777;
  font-size:13px;
  margin-top:3px;
}

.product-price{
  font-weight:bold;
  white-space:nowrap;
}

.money-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}

.grand-total{
  border-top:1px solid #ddd;
  margin-top:5px;
  padding-top:10px;
  font-size:18px;
  font-weight:bold;
}

.status-box{
  display:flex;
  align-items:center;
  gap:12px;
}

.status-box select{
  max-width:200px;
}


/* =========================
   NOTE MODAL
========================= */

.note-modal-box{
  max-width:520px;
}

.note-modal-body{
  padding:20px;
}

.note-modal-body textarea{
  min-height:130px;
  resize:vertical;
}

.note-save-row{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

.save-note-btn{
  background:#111;
  color:#fff;
}

.note-status{
  color:#08752b;
  font-size:13px;
  margin-top:9px;
  display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:1000px){

  .stats{
    grid-template-columns:repeat(4,1fr);
  }

}

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .customer-grid{
    grid-template-columns:1fr;
  }

  .modal{
    padding:8px;
  }

  .modal-box{
    max-height:96vh;
  }

}
</style>
</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

  <div>
    <h1>RM Online Shop — Admin</h1>
    <small>Order Management Dashboard</small>
  </div>

  <button
    id="logoutBtn"
    class="logout-btn"
    style="display:none;"
  >
    Logout
  </button>

</div>


<div class="container">


<!-- =========================
     LOGIN
========================= -->

<div
  id="loginBox"
  class="login-box"
>

  <h2>Admin Login</h2>

  <p style="color:#777;">
    RM Online Shop Admin Dashboard
  </p>

  <label>Username</label>

  <input
    id="username"
    type="text"
    placeholder="rmmorsalin"
    autocomplete="username"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Enter your password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="login-btn"
  >
    Login
  </button>

  <div
    id="loginMessage"
    class="message"
  ></div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div
  id="dashboard"
  class="dashboard"
  style="display:none;"
>

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
  ">

    <div>

      <h2 style="margin-bottom:4px;">
        Orders
      </h2>

      <p style="
        margin:0;
        color:#777;
      ">
        Customer orders and order management
      </p>

    </div>

    <button
      id="refreshBtn"
      style="
        background:#111;
        color:#fff;
      "
    >
      Refresh Orders
    </button>

  </div>


  <!-- STATUS BOXES -->

  <div class="stats">

    <div
      class="stat active"
      data-filter="all"
    >
      <strong id="totalCount">0</strong>
      Total
    </div>

    <div
      class="stat"
      data-filter="incomplete"
    >
      <strong id="incompleteCount">0</strong>
      Incomplete
    </div>

    <div
      class="stat"
      data-filter="new"
    >
      <strong id="newCount">0</strong>
      New
    </div>

    <div
      class="stat"
      data-filter="confirmed"
    >
      <strong id="confirmedCount">0</strong>
      Confirmed
    </div>

    <div
      class="stat"
      data-filter="processing"
    >
      <strong id="processingCount">0</strong>
      Processing
    </div>

    <div
      class="stat"
      data-filter="delivered"
    >
      <strong id="deliveredCount">0</strong>
      Delivered
    </div>

    <div
      class="stat"
      data-filter="cancelled"
    >
      <strong id="cancelledCount">0</strong>
      Cancelled
    </div>

  </div>


  <!-- SEARCH -->

  <div class="toolbar">

    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        type="text"
        placeholder="Search order, name, phone, district, product..."
      >

    </div>

    <select id="sortSelect">

      <option value="newest">
        Newest First
      </option>

      <option value="oldest">
        Oldest First
      </option>

      <option value="high">
        Highest Total
      </option>

      <option value="low">
        Lowest Total
      </option>

    </select>

    <button id="clearFilterBtn">
      Clear
    </button>

  </div>


  <div
    id="resultInfo"
    class="result-info"
  ></div>


  <!-- COMPACT ORDERS -->

  <div
    id="orders"
    class="order-list"
  >
    <div class="empty">
      Loading orders...
    </div>
  </div>


</div>

</div>


<!-- =========================
     DETAILS MODAL
========================= -->

<div
  id="detailsModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="detailsTitle">
        Order Details
      </h3>

      <button
        class="close-btn"
        id="closeDetails"
      >
        ×
      </button>

    </div>

    <div
      id="detailsBody"
      class="modal-body"
    ></div>

  </div>

</div>


<!-- =========================
     NOTE MODAL
========================= -->

<div
  id="noteModal"
  class="modal"
>

  <div class="modal-box note-modal-box">

    <div class="modal-header">

      <h3>
        📝 Admin Note
      </h3>

      <button
        class="close-btn"
        id="closeNote"
      >
        ×
      </button>

    </div>

    <div class="note-modal-body">

      <div
        id="noteOrderTitle"
        style="
          font-weight:bold;
          margin-bottom:10px;
        "
      ></div>

      <textarea
        id="noteInput"
        placeholder="Write a note about this customer/order..."
      ></textarea>

      <div class="note-save-row">

        <button
          id="cancelNote"
          style="background:#eee;"
        >
          Cancel
        </button>

        <button
          id="saveNoteBtn"
          class="save-note-btn"
        >
          Save Note
        </button>

      </div>

      <div
        id="noteStatus"
        class="note-status"
      >
        Note saved successfully.
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://bjcvebffuayrslsgntoq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5Qpjyf0cWmvxjTnhSRv7KQ_xD7udg0Z";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   ADMIN LOGIN
========================= */

const ADMIN_USERNAME =
  "rmmorsalin";

const ADMIN_EMAIL =
  "mowsumimorsalin@gmail.com";


/* =========================
   ELEMENTS
========================= */

const loginBox =
  document.getElementById("loginBox");

const dashboard =
  document.getElementById("dashboard");

const usernameInput =
  document.getElementById("username");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginMessage =
  document.getElementById("loginMessage");

const refreshBtn =
  document.getElementById("refreshBtn");

const ordersContainer =
  document.getElementById("orders");

const searchInput =
  document.getElementById("searchInput");

const sortSelect =
  document.getElementById("sortSelect");

const clearFilterBtn =
  document.getElementById("clearFilterBtn");

const resultInfo =
  document.getElementById("resultInfo");

const detailsModal =
  document.getElementById("detailsModal");

const detailsBody =
  document.getElementById("detailsBody");

const detailsTitle =
  document.getElementById("detailsTitle");

const closeDetails =
  document.getElementById("closeDetails");

const noteModal =
  document.getElementById("noteModal");

const noteInput =
  document.getElementById("noteInput");

const noteOrderTitle =
  document.getElementById("noteOrderTitle");

const closeNote =
  document.getElementById("closeNote");

const cancelNote =
  document.getElementById("cancelNote");

const saveNoteBtn =
  document.getElementById("saveNoteBtn");

const noteStatus =
  document.getElementById("noteStatus");


/* =========================
   DATA
========================= */

let allOrders = [];

let currentFilter = "all";

let currentNoteOrderId = null;


/* =========================
   MESSAGE
========================= */

function showLoginMessage(
  message
){

  loginMessage.textContent =
    message;

  loginMessage.className =
    "message error";

  loginMessage.style.display =
    "block";

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
  "click",
  async function(){

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;


    if(
      !username ||
      !password
    ){

      showLoginMessage(
        "Username and password are required."
      );

      return;
    }


    if(
      username !==
      ADMIN_USERNAME
    ){

      showLoginMessage(
        "Invalid admin username."
      );

      return;
    }


    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "Logging in...";


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:
          ADMIN_EMAIL,

        password:
          password

      });


    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "Login";


    if(error){

      showLoginMessage(
        error.message
      );

      return;
    }


    if(
      !data ||
      !data.user
    ){

      showLoginMessage(
        "Login failed."
      );

      return;
    }


    loginMessage.style.display =
      "none";


    await showDashboard();

  }
);


/* =========================
   SHOW DASHBOARD
========================= */

async function showDashboard(){

  loginBox.style.display =
    "none";

  dashboard.style.display =
    "block";

  logoutBtn.style.display =
    "block";


  await loadOrders();

}


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
  "click",
  async function(){

    await supabaseClient.auth.signOut();


    dashboard.style.display =
      "none";

    loginBox.style.display =
      "block";

    logoutBtn.style.display =
      "none";

    passwordInput.value =
      "";

  }
);


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  ordersContainer.innerHTML =
    '<div class="empty">Loading orders...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    ordersContainer.innerHTML =
      '<div class="empty">Could not load orders: ' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }


  allOrders =
    data || [];


  updateStats();

  applyFilters();

}


/* =========================
   STATS
========================= */

function updateStats(){

  document.getElementById(
    "totalCount"
  ).textContent =
    allOrders.length;


  document.getElementById(
    "incompleteCount"
  ).textContent =
    countStatus("incomplete");


  document.getElementById(
    "newCount"
  ).textContent =
    countStatus("new");


  document.getElementById(
    "confirmedCount"
  ).textContent =
    countStatus("confirmed");


  document.getElementById(
    "processingCount"
  ).textContent =
    countStatus("processing");


  document.getElementById(
    "deliveredCount"
  ).textContent =
    countStatus("delivered");


  document.getElementById(
    "cancelledCount"
  ).textContent =
    countStatus("cancelled");

}


function countStatus(status){

  return allOrders.filter(
    function(order){

      return String(
        order.status || ""
      ).toLowerCase() === status;

    }
  ).length;

}


/* =========================
   FILTER
========================= */

function applyFilters(){

  let orders =
    [...allOrders];


  if(
    currentFilter !==
    "all"
  ){

    orders =
      orders.filter(
        function(order){

          return String(
            order.status || ""
          ).toLowerCase() ===
          currentFilter;

        }
      );

  }


  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  if(search){

    orders =
      orders.filter(
        function(order){

          const products =
            Array.isArray(
              order.products
            )
            ? order.products
            : [];


          const productText =
            products.map(
              function(product){

                return String(
                  product.name || ""
                );

              }
            ).join(" ");


          const searchableText = [

            order.order_number,

            order.customer_name,

            order.phone,

            order.address,

            order.district,

            order.thana,

            productText

          ].join(" ").toLowerCase();


          return searchableText
            .includes(search);

        }
      );

  }


  if(
    sortSelect.value ===
    "newest"
  ){

    orders.sort(
      function(a,b){

        return new Date(
          b.created_at
        ) -
        new Date(
          a.created_at
        );

      }
    );

  }


  if(
    sortSelect.value ===
    "oldest"
  ){

    orders.sort(
      function(a,b){

        return new Date(
          a.created_at
        ) -
        new Date(
          b.created_at
        );

      }
    );

  }


  if(
    sortSelect.value ===
    "high"
  ){

    orders.sort(
      function(a,b){

        return Number(
          b.total || 0
        ) -
        Number(
          a.total || 0
        );

      }
    );

  }


  if(
    sortSelect.value ===
    "low"
  ){

    orders.sort(
      function(a,b){

        return Number(
          a.total || 0
        ) -
        Number(
          b.total || 0
        );

      }
    );

  }


  resultInfo.textContent =
    "Showing " +
    orders.length +
    " of " +
    allOrders.length +
    " orders";


  renderOrders(
    orders
  );

}


/* =========================
   RENDER COMPACT ORDERS
========================= */

function renderOrders(
  orders
){

  if(
    !orders.length
  ){

    ordersContainer.innerHTML =
      '<div class="empty">No orders found.</div>';

    return;
  }


  let html = `

    <table class="order-table">

      <thead>

        <tr>

          <th>Order</th>

          <th>Customer</th>

          <th>Phone</th>

          <th>Total</th>

          <th>Status</th>

          <th>Note</th>

          <th>View</th>

        </tr>

      </thead>

      <tbody>

  `;


  orders.forEach(
    function(order){

      const note =
        String(
          order.notes || ""
        ).trim();


      const total =
        Number(
          order.total || 0
        );


      const date =
        order.created_at
        ? new Date(
            order.created_at
          ).toLocaleString()
        : "-";


      html += `

        <tr class="order-row">

          <td>

            <div class="order-number">
              ${escapeHtml(
                order.order_number ||
                "-"
              )}
            </div>

            <div class="order-date">
              ${escapeHtml(date)}
            </div>

          </td>


          <td>

            <div class="customer-name">
              ${escapeHtml(
                order.customer_name ||
                "-"
              )}
            </div>

          </td>


          <td>

          item.id

  );

/* =========================
   SAVE NOTE
========================= */

saveNoteBtn.addEventListener(
  "click",
  async function(){

    if(!currentNoteOrderId){
      return;
    }


    const note =
      noteInput.value;


    saveNoteBtn.disabled =
      true;

    saveNoteBtn.textContent =
      "Saving...";


    const {
      error
    } =
      await supabaseClient
        .from("orders")
        .update({
          notes:note
        })
        .eq(
          "id",
          currentNoteOrderId
        );


    saveNoteBtn.disabled =
      false;

    saveNoteBtn.textContent =
      "Save Note";


    if(error){

      alert(
        "Could not save note:\n" +
        error.message
      );

      return;
    }


    const order =
      allOrders.find(
        function(item){

          return String(
            item.id
          ) ===
          String(
            currentNoteOrderId
          );

        }
      );


    if(order){

      order.notes =
        note;

    }


    noteStatus.style.display =
      "block";


    /*
      Update compact list immediately
    */

    applyFilters();


    setTimeout(
      function(){

        noteStatus.style.display =
          "none";

      },
      1800
    );

  }
);

/* =========================
   UPDATE STATUS
========================= */

async function updateOrderStatus(
  orderId,
  newStatus,
  refreshAfter = true
){

  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .update({
        status:newStatus
      })
      .eq(
        "id",
        orderId
      );


  if(error){

    alert(
      "Could not update order status:\n" +
      error.message
    );

    return;

  }


  const order =
    allOrders.find(
      function(item){

        return String(
          item.id
        ) ===
        String(orderId);

      }
    );


  if(order){

    order.status =
      newStatus;

  }


  updateStats();


  if(refreshAfter){

    applyFilters();

  }

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

<script>
(function(){

    const btn = document.createElement("button");

    btn.className = "rm-customer-check-btn";
    btn.innerHTML = "🔎 Customer Check";

      document.getElementById("rmCustomerCheckOverlay").style.display = "flex";
      setTimeout(function(){
        document.getElementById("rmCustomerPhone").focus();
      },100);
    };

    /* Try common admin header/topbar locations */
    const targets = [
      ".topbar",
      ".admin-topbar",
      ".header-actions",
      ".actions"
    ];

    let placed = false;

    for(const selector of targets){
      const el = document.querySelector(selector);

      if(el){
        el.appendChild(btn);
        placed = true;
        break;
      }
    }

    /* fallback */
    if(!placed){
      document.body.appendChild(btn);
    }

  /* ---------- ESCAPE HTML ---------- */

  function rmEscape(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  /* ---------- CUSTOMER CHECK ---------- */

  window.rmRunCustomerCheck = async function(){

    const input = document.getElementById("rmCustomerPhone");
    const result = document.getElementById("rmCustomerResult");

    const phone = normalizePhone(input.value);

    if(!phone){

      result.innerHTML = `
        <div class="rm-check-warning">
          ⚠️ Customer mobile number দিন।
        </div>
      `;

      return;
    }

    result.innerHTML = `
      <div class="rm-check-empty">
        🔄 Customer data checking...
      </div>
    `;


    try{

      /* Use existing Supabase client */
      let client = null;

      if(typeof supabaseClient !== "undefined"){
        client = supabaseClient;
      }

      if(!client && typeof supabase !== "undefined"){
        client = supabase;
      }

      if(!client){

        result.innerHTML = `
          <div class="rm-check-warning">
            ⚠️ Supabase connection পাওয়া যায়নি।
          </div>
        `;

        return;
      }


      /* Get all orders */
      const response = await client
        .from("orders")
        .select("*")
        .order("created_at",{ascending:false});


      if(response.error){
        throw response.error;
      }


      const allOrders = response.data || [];


      /* Match customer phone */
      const customerOrders = allOrders.filter(function(order){

        return normalizePhone(
          order.phone ||
          order.mobile ||
          order.customer_phone ||
          order.customerPhone
        ) === phone;

      });


      if(customerOrders.length === 0){

        result.innerHTML = `
          <div class="rm-check-empty">

            <div style="font-size:35px;margin-bottom:8px;">
              🔍
            </div>

            <strong>No order found</strong>

            <div style="margin-top:6px;">
              ${rmEscape(phone)}
            </div>

          </div>

          <div class="rm-check-section">

            <div class="rm-check-section-title">
              Courier Check
            </div>

            <div class="rm-courier-grid">

              ${rmCourierCard("Steadfast")}
              ${rmCourierCard("REDX")}
              ${rmCourierCard("Pathao")}
              ${rmCourierCard("CarryBee")}
              ${rmCourierCard("Paperfly")}

            </div>

          </div>
        `;

        return;
      }


      /* ---------- CALCULATE ---------- */

      const total = customerOrders.length;

      const delivered = customerOrders.filter(function(order){
        return rmStatus(order) === "delivered";
      }).length;

      const cancelled = customerOrders.filter(function(order){
        const s = rmStatus(order);

        return [
          "cancelled",
          "canceled",
          "cancel",
          "returned",
          "return"
        ].includes(s);
      }).length;


      const pending = total - delivered - cancelled;


      const deliveryRate =
        total > 0
          ? ((delivered / total) * 100).toFixed(1)
          : "0.0";


      const cancelRate =
        total > 0
          ? ((cancelled / total) * 100).toFixed(1)
          : "0.0";


      const customerName =
        customerOrders[0].customer_name ||
        customerOrders[0].customerName ||
        customerOrders[0].name ||
        "Unknown";


      /* ---------- ORDER TABLE ---------- */

      let rows = "";

      customerOrders.forEach(function(order){

        const status =
          order.status ||
          "Unknown";

        const orderId =
          order.order_number ||
          order.order_id ||
          order.id ||
          "-";

        const date =
          order.created_at
            ? new Date(order.created_at).toLocaleString()
            : "-";

        const totalAmount =
          order.total ??
          order.grand_total ??
          order.amount ??
          "-";


        rows += `
          <tr>

            <td>
              ${rmEscape(orderId)}
            </td>

            <td>
              ${rmEscape(date)}
            </td>

            <td>
              ${rmEscape(status)}
            </td>

            <td>
              ৳${rmEscape(totalAmount)}
            </td>

          </tr>
        `;

      });


      /* ---------- RESULT ---------- */

      result.innerHTML = `

        <div style="
          margin-bottom:15px;
          font-size:15px;
        ">

          <strong>${rmEscape(customerName)}</strong>

          <div style="
            color:#64748b;
            margin-top:4px;
          ">
            📞 ${rmEscape(phone)}
          </div>

        </div>


        <div class="rm-check-summary">

          <div class="rm-check-stat">
            <small>Total Orders</small>
            <strong>${total}</strong>
          </div>

          <div class="rm-check-stat">
            <small>Delivered</small>
            <strong>${delivered}</strong>
          </div>

          <div class="rm-check-stat">
            <small>Cancelled / Returned</small>
            <strong>${cancelled}</strong>
          </div>

          <div class="rm-check-stat">
            <small>Pending</small>
            <strong>${pending}</strong>
          </div>

          <div class="rm-check-stat">
            <small>Delivery Rate</small>
            <strong>${deliveryRate}%</strong>
          </div>

          <div class="rm-check-stat">
            <small>Cancel / Return Rate</small>
            <strong>${cancelRate}%</strong>
          </div>

        </div>


        <div class="rm-check-section">

          <div class="rm-check-section-title">
            🚚 Courier History
          </div>

          <div class="rm-courier-grid">

            ${rmCourierCard("Steadfast")}
            ${rmCourierCard("REDX")}
            ${rmCourierCard("Pathao")}
            ${rmCourierCard("CarryBee")}
            ${rmCourierCard("Paperfly")}

          </div>

        </div>


        <div class="rm-check-section">

          <div class="rm-check-section-title">
            📦 RM Online Shop Order History
          </div>

          <div style="overflow:auto;">

            <table class="rm-order-table">

              <thead>
                <tr>
                  <th>Order</th>
                  <th>Date</th>
                  <th>Status</th>
                  <th>Total</th>
                </tr>
              </thead>

              <tbody>
                ${rows}
              </tbody>

            </table>

          </div>

        </div>


        <div class="rm-check-warning">

          ℹ️ এই Customer Check বর্তমানে তোমার
          <strong>RM Online Shop-এর নিজস্ব order data</strong>
          দিয়ে হিসাব করছে।

          Steadfast, REDX, Pathao, CarryBee ও Paperfly-এর
          external history এখনো API/access না থাকায় দেখানো হচ্ছে না।

        </div>

      `;

    }catch(error){

      console.error(error);

      result.innerHTML = `
        <div class="rm-check-warning">

          ⚠️ Customer check করতে সমস্যা হয়েছে।

          <br><br>

          ${rmEscape(error.message || error)}

        </div>
      `;

    }

  };


  /* ---------- STATUS ---------- */

  function rmStatus(order){

    return String(
      order.status || ""
    )
    .trim()
    .toLowerCase();

  }


  /* ---------- COURIER CARD ---------- */

  function rmCourierCard(name){

    return `
      <div class="rm-courier-card">

        <strong>${rmEscape(name)}</strong>

        <span>
          🔒 Not Connected
        </span>

        <div style="
          margin-top:7px;
          font-size:12px;
          color:#94a3b8;
        ">
          API access required
        </div>

      </div>
    `;

  }


  /* ---------- START ---------- */

  function startCustomerChecker(){

    createCustomerCheck();

    addCustomerCheckButton();

  }


  if(document.readyState === "loading"){

    document.addEventListener(
      "DOMContentLoaded",
      startCustomerChecker
    );

  }else{

    startCustomerChecker();

  }


  /* In case existing admin UI loads later */
  setTimeout(startCustomerChecker,1000);
  setTimeout(startCustomerChecker,2500);

})();
</script>body>
</html>
