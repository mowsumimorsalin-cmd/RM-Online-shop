<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RM Online Shop - Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .topbar {
      background: #111;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
    }

    .topbar small {
      color: #bbb;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .login-box,
    .dashboard {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    }

    .login-box {
      max-width: 430px;
      margin: 70px auto;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      margin-top: 20px;
      background: #111;
      color: white;
    }

    .logout-btn {
      background: white;
      color: #111;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    .success {
      background: #e7f8eb;
      color: #08752b;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .orders {
      display: grid;
      gap: 16px;
    }

    .order-card {
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      padding: 18px;
      background: white;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .order-number {
      font-weight: bold;
      font-size: 18px;
    }

    .customer {
      line-height: 1.7;
    }

    .products {
      margin-top: 12px;
      background: #fafafa;
      padding: 12px;
      border-radius: 8px;
    }

    .product-row {
      padding: 7px 0;
      border-bottom: 1px solid #eee;
    }

    .product-row:last-child {
      border-bottom: 0;
    }

    .total {
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .status-row {
      margin-top: 15px;
      max-width: 300px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    .refresh-btn {
      background: #111;
      color: white;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div>
      <h1>RM Online Shop — Admin</h1>
      <small>Order Management Dashboard</small>
    </div>

    <button id="logoutBtn" class="logout-btn" style="display:none;">
      Logout
    </button>
  </div>

  <div class="container">

    <!-- LOGIN -->
    <div id="loginBox" class="login-box">

      <h2>Admin Login</h2>

      <p>RM Online Shop Admin Dashboard</p>

      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        placeholder="rmmorsalin"
        autocomplete="username"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

      <button id="loginBtn" class="login-btn">
        Login
      </button>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard" style="display:none;">

      <div style="display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap;">
        <div>
          <h2>Orders</h2>
          <p style="margin:0; color:#777;">
            Customer orders and order status
          </p>
        </div>

        <button id="refreshBtn" class="refresh-btn">
          Refresh Orders
        </button>
      </div>


      <div class="stats">

        <div class="stat">
          <strong id="totalCount">0</strong>
          Total
        </div>

        <div class="stat">
          <strong id="incompleteCount">0</strong>
          Incomplete
        </div>

        <div class="stat">
          <strong id="newCount">0</strong>
          New
        </div>

        <div class="stat">
          <strong id="confirmedCount">0</strong>
          Confirmed
        </div>

        <div class="stat">
          <strong id="processingCount">0</strong>
          Processing
        </div>

        <div class="stat">
          <strong id="deliveredCount">0</strong>
          Delivered
        </div>

      </div>


      <div id="orders" class="orders">
        <div class="empty">Loading orders...</div>
      </div>

    </div>

  </div>


<script>
  /*
    ============================================================
    SUPABASE SETTINGS
    ============================================================
  */

  const SUPABASE_URL = "https://bjcvebffuayrslsngtoq.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_5Qpjyf0cWmvxjTnhSRv7KQ_xD7udg0Z";


  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /*
    ============================================================
    ADMIN LOGIN SETTINGS
    ============================================================
  */

  const ADMIN_USERNAME = "rmmorsalin";

  const ADMIN_EMAIL = "mowsumimorsalin@gmail.com";


  /*
    ============================================================
    ELEMENTS
    ============================================================
  */

  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");

  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const refreshBtn = document.getElementById("refreshBtn");

  const loginMessage = document.getElementById("loginMessage");
  const ordersContainer = document.getElementById("orders");


  /*
    ============================================================
    MESSAGE
    ============================================================
  */

  function showMessage(message, type = "error") {
    loginMessage.textContent = message;
    loginMessage.className = "message " + type;
    loginMessage.style.display = "block";
  }


  /*
    ============================================================
    LOGIN
    ============================================================
  */

  loginBtn.addEventListener("click", async () => {

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
      showMessage("Username and password are required.");
      return;
    }

    if (username !== ADMIN_USERNAME) {
      showMessage("Invalid admin username.");
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: ADMIN_EMAIL,
        password: password
      });

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

    if (error) {
      showMessage(error.message);
      return;
    }

    if (!data.user) {
      showMessage("Login failed.");
      return;
    }

    loginMessage.style.display = "none";

    await showDashboard();
  });


  /*
    ============================================================
    SHOW DASHBOARD
    ============================================================
  */

  async function showDashboard() {

    loginBox.style.display = "none";
    dashboard.style.display = "block";
    logoutBtn.style.display = "block";

    await loadOrders();
  }


  /*
    ============================================================
    LOGOUT
    ============================================================
  */

  logoutBtn.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    dashboard.style.display = "none";
    loginBox.style.display = "block";
    logoutBtn.style.display = "none";

    passwordInput.value = "";

  });


  /*
    ============================================================
    LOAD ORDERS
    ============================================================
  */

  async function loadOrders() {

    ordersContainer.innerHTML =
      '<div class="empty">Loading orders...</div>';

    const {
      data: orders,
      error
    } = await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      ordersContainer.innerHTML =
        '<div class="empty">Could not load orders: ' +
        escapeHtml(error.message) +
        '</div>';

      return;
    }


    updateStats(orders || []);

    renderOrders(orders || []);
  }


  /*
    ============================================================
    STATS
    ============================================================
  */

  function updateStats(orders) {

    document.getElementById("totalCount").textContent =
      orders.length;

    document.getElementById("incompleteCount").textContent =
      orders.filter(o => o.status === "incomplete").length;

    document.getElementById("newCount").textContent =
      orders.filter(o => o.status === "new").length;

    document.getElementById("confirmedCount").textContent =
      orders.filter(o => o.status === "confirmed").length;

    document.getElementById("processingCount").textContent =
      orders.filter(o => o.status === "processing").length;

    document.getElementById("deliveredCount").textContent =
      orders.filter(o => o.status === "delivered").length;
  }


  /*
    ============================================================
    RENDER ORDERS
    ============================================================
  */

  function renderOrders(orders) {

    if (!orders.length) {

      ordersContainer.innerHTML =
        '<div class="empty">No orders found yet.</div>';

      return;
    }


    ordersContainer.innerHTML = orders.map(order => {

      const products = Array.isArray(order.products)
        ? order.products
        : [];


      const productHtml = products.length
        ? products.map(product => `
            <div class="product-row">
              <strong>${escapeHtml(product.name || "Product")}</strong>
              × ${Number(product.qty || 1)}
              <br>
              ৳${Number(product.price || 0).toLocaleString()}
            </div>
          `).join("")
        : "<div>No product information</div>";


      const createdDate =
        order.created_at
          ? new Date(order.created_at).toLocaleString()
          : "-";


      return `
        <div class="order-card">

          <div class="order-header">

            <div>
              <div class="order-number">
                ${escapeHtml(order.order_number || "Order")}
              </div>

              <small>
                ${escapeHtml(createdDate)}
              </small>
            </div>

            <div>
              <strong>
                ৳${Number(order.total || 0).toLocaleString()}
              </strong>
            </div>

          </div>


          <div class="customer">

            <strong>Customer:</strong>
            ${escapeHtml(order.customer_name || "-")}
            <br>

            <strong>Phone:</strong>
            ${order.phone
              ? `<a href="tel:${escapeHtml(order.phone)}">${escapeHtml(order.phone)}</a>`
              : "-"
            }

            <br>

            <strong>Address:</strong>
            ${escapeHtml(order.address || "-")}

          </div>


          <div class="products">

            <strong>Products</strong>

            ${productHtml}

          </div>


          <div class="total">
            Total: ৳${Number(order.total || 0).toLocaleString()}
          </div>


          <div class="status-row">

            <label>Status</label>

            <select
              class="status-select"
              data-order-id="${order.id}"
            >

              <option value="incomplete"
                ${order.status === "incomplete" ? "selected" : ""}>
                Incomplete
              </option>

              <option value="new"
                ${order.status === "new" ? "selected" : ""}>
                New
              </option>

              <option value="confirmed"
                ${order.status === "confirmed" ? "selected" : ""}>
                Confirmed
              </option>

              <option value="processing"
                ${order.status === "processing" ? "selected" : ""}>
                Processing
              </option>

              <option value="delivered"
                ${order.status === "delivered" ? "selected" : ""}>
                Delivered
              </option>

              <option value="cancelled"
                ${order.status === "cancelled" ? "selected" : ""}>
                Cancelled
              </option>

            </select>

          </div>

        </div>
      `;

    }).join("");


    document
      .querySelectorAll(".status-select")
      .forEach(select => {

        select.addEventListener("change", async () => {

          const orderId = select.dataset.orderId;
          const newStatus = select.value;

          await updateOrderStatus(orderId, newStatus);

        });

      });

  }


  /*
    ============================================================
    UPDATE STATUS
    ============================================================
  */

  async function updateOrderStatus(orderId, newStatus) {

    const {
      error
    } = await supabaseClient
      .from("orders")
      .update({
        status: newStatus
      })
      .eq("id", orderId);


    if (error) {

      alert(
        "Could not update order status:\n" +
        error.message
      );

      return;
    }


    await loadOrders();
  }


  /*
    ============================================================
    REFRESH
    ============================================================
  */

  refreshBtn.addEventListener("click", loadOrders);


  /*
    ============================================================
    CHECK EXISTING SESSION
    ============================================================
  */

  async function checkSession() {

    const {
      data: {
        session
      }
    } = await supabaseClient.auth.getSession();


    if (session && session.user) {

      await showDashboard();

    }

  }


  /*
    ============================================================
    HTML ESCAPE
    ============================================================
  */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  checkSession();

</script>

</body>
</html>
